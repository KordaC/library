# Деплой backend в Render (бесплатный тариф, сервер «засыпает» без трафика).
# https://render.com → New → Blueprint → подключить репозиторий
#
# После деплоя URL вида: https://library-backend-xxxx.onrender.com
# Соберите APK с backend.url=https://library-backend-xxxx.onrender.com/api/v1/

databases:
  - name: library-db
    plan: free
    databaseName: library
    user: library

services:
  - type: web
    name: library-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionString
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseContainerSupport -Xmx384m
