# Один сервис, без PostgreSQL — проще стартует на Render.
# После деплоя URL: https://library-backend-xxxx.onrender.com
# В app/cloud-api.properties укажите тот же URL → соберите release APK.

services:
  - type: web
    name: library-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseContainerSupport -Xmx384m
