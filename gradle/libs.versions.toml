[versions]
agp = "8.13.2"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
activity = "1.13.0"
constraintlayout = "2.2.1"
lifecycle = "2.8.7"
navigation = "2.8.5"
retrofit = "2.11.0"
okhttp = "4.12.0"
gson = "2.11.0"
zxing = "3.5.3"
securityCrypto = "1.1.0-alpha06"
recyclerview = "1.4.0"
splashscreen = "1.0.1"
coil = "2.7.0"
browser = "1.8.0"
firebaseBom = "33.7.0"
