spring:
  datasource:
    url: jdbc:h2:mem:library;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework

library:
  public:
    base-url: ${LIBRARY_PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:}}
