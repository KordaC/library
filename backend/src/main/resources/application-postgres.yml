# PostgreSQL — основная база данных
# Перед bootRun: docker compose up -d  (из корня проекта)

spring:
  datasource:
    url: jdbc:postgresql://localhost:55432/library
    username: library
    password: library
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
