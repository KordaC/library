# Облачный запуск (Render, Railway и т.п.)
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework

library:
  public:
    base-url: ${LIBRARY_PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:}}
