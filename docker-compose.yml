# Нормальная БД PostgreSQL для проекта
# Запуск: docker compose up -d
# Остановка: docker compose down

services:
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "55432:5432"
    volumes:
      - library_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  library_pg_data:
